  intent_profiles:
    - tag: DDI-MOE
      description: 冷启动 DDI 与药物级 OOD 泛化研究，重点关注分布依赖的多源知识效用、药物对级动态 MoE 路由、专家专门化及不变泛化。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: cold-start drug interaction
          keyword_cn: 冷启动药物相互作用
          query: cold-start drug-drug interaction prediction for unseen drugs
        - keyword: drug-level out-of-distribution generalization
          keyword_cn: 药物级分布外泛化
          query: drug-level out-of-distribution generalization under distribution shift
        - keyword: mixture of experts
          keyword_cn: 专家混合模型
          query: mixture-of-experts architecture for drug pair modeling
        - keyword: dynamic expert routing
          keyword_cn: 动态专家路由
          query: sample-level and drug-pair-level dynamic expert routing
        - keyword: invariant representation learning
          keyword_cn: 不变表示学习
          query: invariant representation learning for stable drug generalization
        - keyword: instance-adaptive knowledge fusion
          keyword_cn: 实例自适应知识融合
          query: distribution-aware intervention for out-of-distribution drug prediction
      intent_queries:
        - query: >-
            How can dynamic expert routing be combined with invariant representation learning or distribution aware
            intervention to improve generalization to unseen drugs?
          query_cn: 如何将动态专家路由与不变表示学习或分布感知干预结合，以提升模型对未见药物和冷启动药物对的稳定泛化能力？
          enabled: true
          source: generated
          note: ''
        - query: >-
            How can mixture of experts models learn specialized knowledge integration strategies for different latent
            distribution regimes without manually defining expert semantics?
          query_cn: 如何利用 MoE 在不人工规定专家语义的情况下，使不同专家针对不同潜在分布状态自动形成专门化的知识融合策略？
          enabled: true
          source: generated
          note: ''
        - query: >-
            How can models dynamically adapt knowledge integration strategies to different drug pairs when heterogeneous
            knowledge sources contribute unequally across instances?
          query_cn: 当不同药物对对多源知识的依赖和贡献存在差异时，如何针对当前 drug pair 动态调整知识融合策略？
          enabled: true
          source: generated
          note: ''
        - query: >-
            How does the usefulness of heterogeneous knowledge sources change across seen drug and unseen drug
            distributions in cold start drug drug interaction prediction?
          query_cn: 在冷启动 DDI 预测中，当数据从已见药物分布迁移到未见药物分布时，不同异质知识源的有效性和贡献是否发生变化？
          enabled: true
          source: generated
          note: ''
